name: fitflow
description: "FitFlow — coach IA fitness, nutrition personnalisée, suivi de progression et gamification. Cross-platform iOS & Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend — Firebase (optional, enabled via --dart-define=USE_FIREBASE=true)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Social sign-in (Google / Apple) — used by FirebaseAuthService.
  # Pinned to the 6.x API used in code.
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.2.3

  # Networking (OpenAI / REST backend)
  http: ^1.2.1

  # Charts for progress tracking
  fl_chart: ^0.68.0

  # Typography & UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Workout video playback
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  percent_indicator: ^4.2.3

  # GDPR: data export + opening privacy policy URL
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

  # Lottie vector animations for the login hero (real-looking humans doing
  # exercises). Falls back gracefully to the custom-painted animated mesh
  # gradient + particle field when offline / URL unreachable.
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generate launcher icons & splash from assets/branding/.
  # Run: dart run flutter_launcher_icons && dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

# ---------------------------------------------------------------------------
# App launcher icon (dart run flutter_launcher_icons)
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon_1024.png"
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generated: true
    image_path: "assets/branding/icon_1024.png"
    background_color: "#0E1116"
    theme_color: "#00E676"

# ---------------------------------------------------------------------------
# Splash screen (dart run flutter_native_splash:create)
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0E1116"
  image: "assets/branding/splash.png"
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/branding/splash.png"
    color: "#0E1116"
