name: fitflow
description: "FitFlow — coach IA fitness, nutrition personnalisée, suivi de progression et gamification. Cross-platform iOS & Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.2.3

  # Networking (OpenAI / REST backend)
  http: ^1.2.1

  # Charts for progress tracking
  fl_chart: ^0.68.0

  # Typography & UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Workout video playback
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
