name: FitFlow Release Build

# Builds release binaries for FitFlow. Runs on version tags (v*) or manually.
# Native folders (android/ios) are gitignored, so they are regenerated with
# `flutter create .` before building — this also validates the full native
# build, not just static analysis.
#
# Without signing secrets the Android build uses debug signing (still a valid
# build for verification). For a store-ready signed bundle, provide the
# keystore secrets and a release signingConfig (see fitflow/docs/DEPLOYMENT.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (APK + AppBundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Generate native project
        run: flutter create . --platforms=android,ios,web --project-name fitflow --org com.fitflow

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-android
          path: |
            fitflow/build/app/outputs/flutter-apk/app-release.apk
            fitflow/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
