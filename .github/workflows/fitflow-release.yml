name: FitFlow Release Build

# Builds a downloadable Android APK for FitFlow and attaches it to a GitHub
# Release. Triggered by pushing a tag (v*) or manually via "Run workflow".
#
# Uses the latest stable Flutter so the freshly-resolved plugins (firebase,
# package_info_plus, etc.) match the Android toolchain. This job does not run
# `flutter analyze`, so analyzer deprecations are irrelevant here — the app
# still compiles. The main CI keeps its pinned Flutter for analysis.
#
# Native folders are gitignored and regenerated with `flutter create`. Without
# signing secrets the APK is debug-signed (installable for testing).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v1.0.0-test1)"
        required: true
        default: "v1.0.0-test1"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native Android project
        run: flutter create . --platforms=android --project-name fitflow --org com.fitflow

      - name: Raise Android minSdk to 23 (required by Firebase)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.minSdkVersion/23/g' "$f"
              echo "Patched $f"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release, debug-signed, full-access test build)
        # DEMO_PREMIUM unlocks all Premium features so the app can be fully
        # tested with no payment. Remove this flag for real store builds.
        run: flutter build apk --release --dart-define=DEMO_PREMIUM=true

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FitFlow-${{ steps.meta.outputs.tag }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-apk
          path: fitflow/dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FitFlow ${{ steps.meta.outputs.tag }}
          body: |
            APK de test FitFlow (debug-signed, installable hors stores).

            ⚠️ Active « Installer des applications inconnues » sur Android.
            L'app tourne en mode local (sans backend) : coach IA hors-ligne,
            données stockées sur l'appareil. Icône Flutter par défaut sur ce
            build de test.
          files: fitflow/dist/*.apk
          fail_on_unmatched_files: true
