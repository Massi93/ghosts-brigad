name: FitFlow Release Build

# Builds a downloadable Android APK for FitFlow and attaches it to a GitHub
# Release. Triggered by pushing a tag (v*) or manually.
#
# Native folders (android/ios) are gitignored, so they are regenerated with
# `flutter create .` before building — this also validates the full native
# build, not just static analysis.
#
# Without signing secrets the APK is debug-signed (installable for testing).
# For a Play-Store-ready signed bundle, add the keystore secrets and a release
# signingConfig (see fitflow/docs/DEPLOYMENT.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Generate native project
        run: flutter create . --platforms=android,ios,web --project-name fitflow --org com.fitflow

      - name: Raise Android minSdk to 23 (required by Firebase)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.minSdkVersion/23/g' "$f"
              echo "Patched $f"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK (release, debug-signed)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FitFlow-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-apk
          path: fitflow/dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FitFlow ${{ github.ref_name }}
          body: |
            APK de test FitFlow (debug-signed, installable hors stores).

            ⚠️ Active « Sources inconnues » sur Android pour l'installer.
            L'app tourne en mode local (sans backend) — coach IA hors-ligne,
            données stockées sur l'appareil.
          files: fitflow/dist/*.apk
          fail_on_unmatched_files: true
