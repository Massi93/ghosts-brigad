name: das-shop Android build

on:
  push:
    paths:
      - "das-shop/apps/android/**"
      - ".github/workflows/das-shop-android-build.yml"
  pull_request:
    paths:
      - "das-shop/apps/android/**"
      - ".github/workflows/das-shop-android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: das-shop/apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p ../../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../../dist/das-shop-debug.apk
          ls -la ../../../dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: das-shop-debug-apk
          path: dist/das-shop-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release (public download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/das-shop-android-web-setup-kgqkgr'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: das-shop-debug-latest
          name: das-shop debug APK (latest)
          body: |
            Debug APK built automatically from the latest commit on the das-shop branch.

            **Direct download URL** (no login required):
            https://github.com/Massi93/ghosts-brigad/releases/download/das-shop-debug-latest/das-shop-debug.apk

            Built from commit ${{ github.sha }}.
          files: dist/das-shop-debug.apk
          draft: false
          prerelease: true
          make_latest: false
