name: Backtest GhostsBrigad

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Date de debut (YYYY-MM-DD)"
        required: false
        default: "2025-07-01"
      end:
        description: "Date de fin (YYYY-MM-DD)"
        required: false
        default: "2026-06-30"
  push:
    branches: [BrigadBot]
    paths:
      - "ghostsbrigad-mt5/backtest/**"
      - ".github/workflows/backtest.yml"

env:
  START: ${{ inputs.start || '2025-07-01' }}
  END: ${{ inputs.end || '2026-06-30' }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ghostsbrigad-mt5/backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache des donnees Dukascopy
        uses: actions/cache@v4
        with:
          path: ghostsbrigad-mt5/backtest/data
          key: dukascopy-v2-${{ env.START }}-${{ env.END }}
          restore-keys: dukascopy-

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Backtest configs finales avec/sans confluence, 2 periodes
        run: |
          # Chaque config testee sur la periode de reglage ET sur la
          # periode jamais vue (out-of-sample), avec et sans la porte
          # de confluence (Dow, Fibonacci, VWAP, SMC, order flow).
          for period in "$START $END" "2024-07-01 2025-06-30"; do
            set -- $period
            P_START=$1; P_END=$2
            for combo in "XAUUSD 5 standard none off" \
                         "XAUUSD 5 standard none on" \
                         "BTCUSD 15 standard all off" \
                         "BTCUSD 15 standard all on"; do
              set -- $combo
              echo "::group::$1 M$2 / $3 / filtres=$4 / confluence=$5 / $P_START"
              python ghostsbrigad_backtest.py \
                --symbol "$1" --tf "$2" --account "$3" --filters "$4" \
                --confluence "$5" --start "$P_START" --end "$P_END" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
            done
          done

