name: Backtest GhostsBrigad

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Date de debut (YYYY-MM-DD)"
        required: false
        default: "2025-07-01"
      end:
        description: "Date de fin (YYYY-MM-DD)"
        required: false
        default: "2026-06-30"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ghostsbrigad-mt5/backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache des donnees Dukascopy
        uses: actions/cache@v4
        with:
          path: ghostsbrigad-mt5/backtest/data
          key: dukascopy-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: dukascopy-

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Backtest XAUUSD + BTCUSD (Standard et Raw Spread)
        run: |
          for sym in XAUUSD BTCUSD; do
            for acc in standard raw; do
              echo "::group::$sym / $acc"
              python ghostsbrigad_backtest.py \
                --symbol "$sym" --account "$acc" \
                --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
            done
          done

