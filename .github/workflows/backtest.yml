name: Backtest GhostsBrigad

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Date de debut (YYYY-MM-DD)"
        required: false
        default: "2025-07-01"
      end:
        description: "Date de fin (YYYY-MM-DD)"
        required: false
        default: "2026-06-30"
  push:
    branches: [BrigadBot]
    paths:
      - "ghostsbrigad-mt5/backtest/**"
      - ".github/workflows/backtest.yml"

env:
  START: ${{ inputs.start || '2025-07-01' }}
  END: ${{ inputs.end || '2026-06-30' }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ghostsbrigad-mt5/backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache des donnees Dukascopy
        uses: actions/cache@v4
        with:
          path: ghostsbrigad-mt5/backtest/data
          key: dukascopy-${{ env.START }}-${{ env.END }}
          restore-keys: dukascopy-

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Backtest XAUUSD + BTCUSD (filtres scalping, multi-timeframes)
        run: |
          for combo in "XAUUSD 5 standard" "XAUUSD 5 raw" \
                       "BTCUSD 5 raw" "BTCUSD 15 raw" "BTCUSD 30 raw"; do
            set -- $combo
            echo "::group::$1 M$2 / $3"
            python ghostsbrigad_backtest.py \
              --symbol "$1" --tf "$2" --account "$3" \
              --start "$START" --end "$END" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

