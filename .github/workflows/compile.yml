name: Compile EA

on:
  workflow_dispatch:
  push:
    branches: [BrigadBot]
    paths:
      - "ghostsbrigad-mt5/Experts/**/*.mq5"
      - "ghostsbrigad-mt5/Experts/**/*.mqh"
      - ".github/workflows/compile.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process .\mt5setup.exe -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 20
          if (-not (Test-Path "C:\Program Files\MetaTrader 5\metaeditor64.exe")) { throw "MetaEditor introuvable apres installation" }

      - name: Compiler GhostsBrigad_EA
        shell: pwsh
        run: |
          $mt5 = "C:\Program Files\MetaTrader 5"
          # 1er lancement du terminal en mode portable : cree MQL5\Include
          $t = Start-Process "$mt5\terminal64.exe" -ArgumentList "/portable" -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while (-not (Test-Path "$mt5\MQL5\Include\Trade\Trade.mqh") -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (-not (Test-Path "$mt5\MQL5\Include\Trade\Trade.mqh")) { throw "Include standard absent apres 1er lancement" }
          # Chemins SANS espaces pour eviter tout probleme de quoting
          New-Item -ItemType Directory -Force -Path "C:\build\MQL5\Experts" | Out-Null
          Copy-Item "ghostsbrigad-mt5\Experts\GhostsBrigad" "C:\build\MQL5\Experts\GhostsBrigad" -Recurse -Force
          Copy-Item "$mt5\MQL5\Include" "C:\build\MQL5\Include" -Recurse -Force
          $ea = "C:\build\MQL5\Experts\GhostsBrigad\GhostsBrigad_EA.mq5"
          $p = Start-Process -FilePath "$mt5\metaeditor64.exe" `
            -ArgumentList "/compile:$ea /include:C:\build\MQL5 /log" -Wait -PassThru
          Write-Host "MetaEditor exit code (nb fichiers compiles): $($p.ExitCode)"
          $log = "C:\build\MQL5\Experts\GhostsBrigad\GhostsBrigad_EA.log"
          if (Test-Path $log) { Get-Content $log -Encoding Unicode } else { Write-Host "Aucun log" }
          $ex5 = "C:\build\MQL5\Experts\GhostsBrigad\GhostsBrigad_EA.ex5"
          if (-not (Test-Path $ex5)) { Write-Error "Compilation echouee"; exit 1 }
          Copy-Item $ex5 "ghostsbrigad-mt5\Experts\GhostsBrigad\"
          Write-Host "OK: GhostsBrigad_EA.ex5 genere"

      - name: Publier le .ex5 compile sur la branche
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ghostsbrigad-mt5/Experts/GhostsBrigad/GhostsBrigad_EA.ex5
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "EA compile automatiquement (.ex5 pret a l'emploi) [skip ci]"
            git push
          } else { Write-Host "ex5 inchange" }
